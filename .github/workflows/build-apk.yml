name: Publicar Ingles con Fran Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Ingles-con-Fran-ANDROID-PROYECTO-PARA-COMPILAR.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto Android
        run: unzip -q Ingles-con-Fran-ANDROID-PROYECTO-PARA-COMPILAR.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon
      - name: Preparar archivo de entrega
        run: cp project/app/build/outputs/apk/debug/app-debug.apk Ingles-con-Fran.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ingles-con-Fran-Android
          path: Ingles-con-Fran.apk
      - name: Publicar descarga estable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete prueba-fran --cleanup-tag -y 2>/dev/null || true
          gh release create prueba-fran Ingles-con-Fran.apk --title "Inglés con Fran — prueba" --notes "Versión Android probada previamente en teléfono."
