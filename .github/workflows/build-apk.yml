name: Compilar Ingles con Fran Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Ingles-con-Fran-ANDROID-PROYECTO-PARA-COMPILAR.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto Android
        run: unzip -q Ingles-con-Fran-ANDROID-PROYECTO-PARA-COMPILAR.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Ingles-con-Fran-Android
          path: project/app/build/outputs/apk/debug/app-debug.apk
