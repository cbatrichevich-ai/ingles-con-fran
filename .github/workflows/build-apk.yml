name: Compilar laboratorio RED micrófono

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lab/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir base Android congelada
        run: unzip -q Ingles-con-Fran-ANDROID-PROYECTO-PARA-COMPILAR.zip
      - name: Aplicar únicamente laboratorio RED
        run: python3 lab/apply_lab.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK laboratorio
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon
      - name: Preparar APK laboratorio
        run: cp project/app/build/outputs/apk/debug/app-debug.apk Ingles-con-Fran-LAB-RED-MIC.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ingles-con-Fran-LAB-RED-MIC
          path: Ingles-con-Fran-LAB-RED-MIC.apk
      - name: Publicar descarga laboratorio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete lab-red-mic --cleanup-tag -y 2>/dev/null || true
          gh release create lab-red-mic Ingles-con-Fran-LAB-RED-MIC.apk --title "Laboratorio RED + micrófono" --notes "Prueba aislada: sólo RED activa el nuevo pase de turno y reconocimiento de voz. La base aprobada no se reemplaza."
      - name: Registrar resultado del laboratorio
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          printf 'status=%s\nrun_id=%s\nrun_attempt=%s\nhead_sha=%s\n' "$BUILD_STATUS" "$RUN_ID" "$RUN_ATTEMPT" "$HEAD_SHA" > /tmp/lab_status.txt
          CONTENT=$(base64 -w0 /tmp/lab_status.txt)
          CURRENT_SHA=$(gh api repos/${{ github.repository }}/contents/LAB_RED_BUILD_STATUS.txt --jq .sha 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/LAB_RED_BUILD_STATUS.txt \
              -f message="Registrar resultado laboratorio RED" \
              -f content="$CONTENT" \
              -f sha="$CURRENT_SHA" \
              -f branch="main"
          else
            gh api --method PUT repos/${{ github.repository }}/contents/LAB_RED_BUILD_STATUS.txt \
              -f message="Registrar resultado laboratorio RED" \
              -f content="$CONTENT" \
              -f branch="main"
          fi
