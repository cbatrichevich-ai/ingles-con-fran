name: Compilar APTARI Asistente de Ventas FINAL

on:
  workflow_dispatch:
  push:
    branches: [ main, aptari-evolucion-1 ]
    paths:
      - 'aptari-asistente-ventas-final/**'
      - '.github/workflows/build-aptari-asistente-ventas-final.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Crear proyecto Android final aislado
        run: |
          set -euo pipefail
          mkdir -p aptari-final/app/src/main/java/com/aptari/asistenteventas
          mkdir -p aptari-final/app/src/main/assets
          mkdir -p aptari-final/app/src/main/res/values
          mkdir -p aptari-final/app/src/main/res/drawable
          cp aptari-asistente-ventas-final/index.html aptari-final/app/src/main/assets/index.html

          cat > aptari-final/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name='AptariAsistenteVentas'
          include ':app'
          EOF

          cat > aptari-final/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > aptari-final/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.aptari.asistenteventas'
            compileSdk 35
            defaultConfig {
              applicationId 'com.aptari.asistenteventas'
              minSdk 24
              targetSdk 35
              versionCode 10100
              versionName '1.1.0'
            }
            buildTypes {
              release {
                minifyEnabled false
                shrinkResources false
              }
            }
          }
          EOF

          cat > aptari-final/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">APTARI Asistente de Ventas</string></resources>
          EOF

          cat > aptari-final/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0B5666" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M22,85 L48,22 C51,15 57,15 60,22 L87,85 L69,85 L54,49 L40,85 Z"/>
            <path android:fillColor="#70D4CF" android:pathData="M39,68 L67,68 L74,85 L32,85 Z"/>
          </vector>
          EOF

          cat > aptari-final/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:allowBackup="false"
              android:usesCleartextTraffic="false"
              android:label="@string/app_name"
              android:icon="@drawable/ic_launcher"
              android:roundIcon="@drawable/ic_launcher"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:label="@string/app_name"
                android:screenOrientation="portrait">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > aptari-final/app/src/main/java/com/aptari/asistenteventas/MainActivity.java <<'EOF'
          package com.aptari.asistenteventas;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private WebView webView;
            @Override protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              webView = new WebView(this);
              setContentView(webView);
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(false);
              s.setAllowFileAccessFromFileURLs(false);
              s.setAllowUniversalAccessFromFileURLs(false);
              s.setGeolocationEnabled(false);
              s.setMediaPlaybackRequiresUserGesture(true);
              webView.setWebViewClient(new WebViewClient() {
                private boolean external(String url) {
                  if (url != null && (url.startsWith("https://wa.me/") || url.startsWith("whatsapp://"))) {
                    try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); } catch (Exception ignored) {}
                    return true;
                  }
                  return false;
                }
                @Override public boolean shouldOverrideUrlLoading(WebView view, String url) { return external(url); }
                @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                  return request != null && external(request.getUrl().toString());
                }
              });
              webView.loadUrl("file:///android_asset/index.html");
            }
            @Override public void onBackPressed() {
              if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
            }
          }
          EOF

      - name: Control estático
        run: |
          set -euo pipefail
          H=aptari-asistente-ventas-final/index.html
          grep -q 'APTARI' "$H"
          grep -q 'ASISTENTE DE VENTAS' "$H"
          grep -q "aptari_asistente_ventas_v1" "$H"
          grep -q 'AGREGAR PRIMER CLIENTE' "$H"
          grep -q '¿Qué sigue?' "$H"
          grep -q 'PRÓXIMA ACCIÓN' "$H"
          grep -q 'Mañana' "$H"
          if grep -qiE 'V0|prueba funcional|datos de demostración|Mi Oficina|Enviar presupuesto|Presupuesto enviado|APB|a prueba de boludos' "$H"; then
            echo 'Texto de prueba u obsoleto detectado' >&2; exit 1
          fi
          if grep -q '<uses-permission' aptari-final/app/src/main/AndroidManifest.xml; then
            echo 'No debe solicitar permisos Android' >&2; exit 1
          fi

      - name: Compilar release sin firmar
        working-directory: aptari-final
        run: gradle :app:assembleRelease --no-daemon

      - name: Verificar y alinear APK
        run: |
          set -euo pipefail
          APK=aptari-final/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          unzip -p "$APK" assets/index.html > /tmp/index-final.html
          grep -q 'APTARI' /tmp/index-final.html
          grep -q 'aptari_asistente_ventas_v1' /tmp/index-final.html
          grep -q '¿Qué sigue?' /tmp/index-final.html
          grep -q 'PRÓXIMA ACCIÓN' /tmp/index-final.html
          if grep -qiE 'V0|prueba funcional|datos de demostración|APB|a prueba de boludos' /tmp/index-final.html; then
            echo 'APK contiene texto no comercial' >&2; exit 1
          fi
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -type f -path '*/lib/apksigner.jar' | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.aptari.asistenteventas'" /tmp/badging.txt
          grep -q "versionName='1.1.0'" /tmp/badging.txt
          grep -q "application-label:'APTARI Asistente de Ventas'" /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          if grep -q '^uses-permission:' /tmp/permissions.txt; then
            echo 'APK solicita permisos inesperados' >&2; exit 1
          fi
          "$ZIPALIGN" -p -f 4 "$APK" APTARI-Asistente-de-Ventas-Android-v1.1.0-UNSIGNED-ALIGNED.apk
          cp "$APKSIGNER_JAR" apksigner.jar
          sha256sum APTARI-Asistente-de-Ventas-Android-v1.1.0-UNSIGNED-ALIGNED.apk > APK_UNSIGNED_SHA256.txt
          cp /tmp/badging.txt APK_BADGING.txt
          cp /tmp/permissions.txt APK_PERMISSIONS.txt

      - name: Subir candidato para firma privada
        uses: actions/upload-artifact@v4
        with:
          name: APTARI-Asistente-de-Ventas-E1-para-firma
          path: |
            APTARI-Asistente-de-Ventas-Android-v1.1.0-UNSIGNED-ALIGNED.apk
            apksigner.jar
            APK_UNSIGNED_SHA256.txt
            APK_BADGING.txt
            APK_PERMISSIONS.txt
          if-no-files-found: error
