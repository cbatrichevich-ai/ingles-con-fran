name: Compilar APTARI Asistente de Ventas V0

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'aptari-asistente-ventas-v0/**'
      - '.github/workflows/build-aptari-asistente-ventas.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Crear proyecto Android mínimo y aislado
        run: |
          mkdir -p aptari-build/app/src/main/java/com/aptari/asistenteventas
          mkdir -p aptari-build/app/src/main/assets
          mkdir -p aptari-build/app/src/main/res/values
          cp aptari-asistente-ventas-v0/index.html aptari-build/app/src/main/assets/index.html

          cat > aptari-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'AptariAsistenteVentas'
          include ':app'
          EOF

          cat > aptari-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > aptari-build/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.aptari.asistenteventas'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aptari.asistenteventas'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '0.1.0'
              }
          }
          EOF

          cat > aptari-build/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">APTARI Asistente de Ventas</string>
          </resources>
          EOF

          cat > aptari-build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > aptari-build/app/src/main/java/com/aptari/asistenteventas/MainActivity.java <<'EOF'
          package com.aptari.asistenteventas;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(false);
                  s.setAllowFileAccessFromFileURLs(false);
                  s.setAllowUniversalAccessFromFileURLs(false);
                  s.setGeolocationEnabled(false);
                  s.setMediaPlaybackRequiresUserGesture(true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url != null && (url.startsWith("https://wa.me/") || url.startsWith("whatsapp://"))) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              } catch (Exception ignored) { }
                              return true;
                          }
                          return false;
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Control estático antes de compilar
        run: |
          set -euo pipefail
          grep -q 'APTARI.*ASISTENTE DE VENTAS' aptari-asistente-ventas-v0/index.html
          grep -q 'Precio enviado' aptari-asistente-ventas-v0/index.html
          if grep -qiE 'Mi Oficina|Enviar presupuesto|Presupuesto enviado' aptari-asistente-ventas-v0/index.html; then
            echo 'Texto obsoleto detectado' >&2
            exit 1
          fi
          if grep -q '<uses-permission' aptari-build/app/src/main/AndroidManifest.xml; then
            echo 'No debe solicitar permisos Android' >&2
            exit 1
          fi

      - name: Compilar APK
        working-directory: aptari-build
        run: gradle :app:assembleDebug --no-daemon

      - name: Verificar APK final
        run: |
          set -euo pipefail
          APK=aptari-build/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -p "$APK" assets/index.html > /tmp/index-final.html
          grep -q 'APTARI.*ASISTENTE DE VENTAS' /tmp/index-final.html
          grep -q 'Precio enviado' /tmp/index-final.html
          if grep -qiE 'Mi Oficina|Enviar presupuesto|Presupuesto enviado' /tmp/index-final.html; then
            echo 'APK contiene texto obsoleto' >&2
            exit 1
          fi
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.aptari.asistenteventas'" /tmp/badging.txt
          grep -q "application-label:'APTARI Asistente de Ventas'" /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          if grep -q '^uses-permission:' /tmp/permissions.txt; then
            echo 'APK solicita permisos inesperados' >&2
            exit 1
          fi
          sha256sum "$APK" | tee /tmp/APK_SHA256.txt
          cp "$APK" APTARI-Asistente-de-Ventas-V0.apk

      - name: Subir APK verificado
        uses: actions/upload-artifact@v4
        with:
          name: APTARI-Asistente-de-Ventas-V0
          path: |
            APTARI-Asistente-de-Ventas-V0.apk
            /tmp/APK_SHA256.txt
          if-no-files-found: error
