name: Compilar Ingles con Fran Jugamos

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'juego/**'
      - '.github/workflows/build-jugamos.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir base Android congelada
        run: unzip -q Ingles-con-Fran-ANDROID-PROYECTO-PARA-COMPILAR.zip
      - name: Crear aplicacion Jugamos independiente
        run: python3 juego/apply_jugamos.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon
      - name: Preparar APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk Ingles-con-Fran-JUGAMOS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ingles-con-Fran-JUGAMOS
          path: Ingles-con-Fran-JUGAMOS.apk
      - name: Publicar APK de prueba
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete prueba-jugamos --cleanup-tag -y 2>/dev/null || true
          gh release create prueba-jugamos Ingles-con-Fran-JUGAMOS.apk --title "Inglés con Fran - Jugamos" --notes "Primera miniapp independiente. Juego La voz manda con voz inglesa del sistema y 10 desafíos por partida."
