name: Compilar Ingles con Fran Jugamos

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'juego/**'
      - '.github/workflows/build-jugamos.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir base Android congelada
        run: unzip -q Ingles-con-Fran-ANDROID-PROYECTO-PARA-COMPILAR.zip
      - name: Crear aplicacion Jugamos independiente
        run: python3 juego/apply_jugamos.py
      - name: Aplicar ritmo pausado y consignas bilingues
        run: python3 juego/patch_bilingue.py
      - name: Aplicar articulos y felicitaciones alternadas
        run: python3 juego/patch_articulos_premio.py
      - name: Validar Juego 1
        run: python3 juego/validate_jugamos.py
      - name: Agregar Juego 2 memoria
        run: python3 juego/patch_memoria.py
      - name: Validar Juego 2 memoria
        run: python3 juego/validate_memoria.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar ejecución real y viewport antes de compilar
        run: node juego/validate_memoria_browser.mjs project/app/src/main/assets/www/JUGAMOS.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon
      - name: Preparar APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk Ingles-con-Fran-JUGAMOS.apk
      - name: Extraer HTML del APK final
        run: |
          python3 - <<'PY'
          import zipfile
          apk='Ingles-con-Fran-JUGAMOS.apk'
          with zipfile.ZipFile(apk) as z:
              data=z.read('assets/www/JUGAMOS.html')
          open('/tmp/JUGAMOS_APK.html','wb').write(data)
          print('HTML final extraído de la APK:', len(data), 'bytes')
          PY
      - name: Verificar HTML material dentro del APK final
        run: |
          python3 - <<'PY'
          s=open('/tmp/JUGAMOS_APK.html',encoding='utf-8').read()
          required={
              'botón Juego 2':'onclick="startMemory()"',
              'botón salir':'onclick="exitToMenu()"',
              '4 posiciones':'grid-template-columns:repeat(4,1fr)',
              'opciones fijas':'.memory-choices{position:fixed',
              'opciones visibles':'bottom:8px',
              '4 originales':'slice(0,4)',
              'misma grilla':"b.textContent=(o.w===missing.w?'❓':o.e)",
              'selector de respuesta':'Elegí la imagen que falta:',
              'mostrar opciones':"box.classList.remove('hidden')"
          }
          missing=[name for name,token in required.items() if token not in s]
          if missing:
              raise SystemExit('APK FINAL NO ENTREGABLE: '+', '.join(missing))
          print('APK FINAL: estructura material requerida presente.')
          PY
      - name: Validar ejecución y viewport sobre el APK final
        run: node juego/validate_memoria_browser.mjs /tmp/JUGAMOS_APK.html
      - uses: actions/upload-artifact@v4
        with:
          name: Ingles-con-Fran-JUGAMOS
          path: Ingles-con-Fran-JUGAMOS.apk
      - name: Publicar APK de prueba
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete prueba-jugamos --cleanup-tag -y 2>/dev/null || true
          gh release create prueba-jugamos Ingles-con-Fran-JUGAMOS.apk --title "Inglés con Fran - Jugamos" --notes "Juego 1 + Juego 2 memoria. Entrega bloqueada si falla runtime, viewport o control material del APK final."
      - name: Registrar resultado comprobable
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          printf 'status=%s\nrun_id=%s\nrun_attempt=%s\nhead_sha=%s\n' "$BUILD_STATUS" "$RUN_ID" "$RUN_ATTEMPT" "$HEAD_SHA" > /tmp/jugamos_status.txt
          CONTENT=$(base64 -w0 /tmp/jugamos_status.txt)
          CURRENT_SHA=$(gh api repos/${{ github.repository }}/contents/JUGAMOS_BUILD_STATUS.txt --jq .sha 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/JUGAMOS_BUILD_STATUS.txt -f message="Registrar resultado Jugamos" -f content="$CONTENT" -f sha="$CURRENT_SHA" -f branch="main"
          else
            gh api --method PUT repos/${{ github.repository }}/contents/JUGAMOS_BUILD_STATUS.txt -f message="Registrar resultado Jugamos" -f content="$CONTENT" -f branch="main"
          fi
