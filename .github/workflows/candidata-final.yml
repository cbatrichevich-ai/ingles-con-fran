name: Candidata integral Ingles con Fran
on:
  push:
    branches: [ agent/auditoria-microfono-punta-a-punta ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Ingles-con-Fran-ANDROID-PROYECTO-PARA-COMPILAR.zip
      - run: python3 lab/apply_candidate.py
      - name: Controles estructurales por flujo real
        run: |
          H=project/app/src/main/assets/www/ABRIR-INGLES-CON-FRAN.html
          J=project/app/src/main/java/com/inglesconfran/app/MainActivity.java
          M=project/app/src/main/AndroidManifest.xml
          test -f project/app/src/main/assets/www/audio/187.wav
          grep -q 'RECORD_AUDIO' "$M"
          grep -q 'EXTRA_LANGUAGE,"en-US"' "$J"
          grep -q 'cancelListening' "$J"
          grep -q "en.onclick=()=>playContent(it.enAudio,it.en,true)" "$H"
          grep -q "es.onclick=()=>playContent(it.esAudio,it.es,false)" "$H"
          grep -q "WHITE:\['WIDE','WAIT'\]" "$H"
          grep -q "DOG:\['DOCK','DAWG'\]" "$H"
          grep -q 'showReward();celebrate()' "$H"
          ! grep -q "en.onclick=()=>playHoraV7" "$H"
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('project/app/src/main/assets/www/ABRIR-INGLES-CON-FRAN.html').read_text()
          ad=Path('project/app/src/main/assets/www/audio')
          refs=sorted(set(re.findall(r'["\'](\d{3}\.wav)["\']',h)))
          assert not [x for x in refs if not (ad/x).exists()]
          low=sorted(int(x[:3]) for x in refs if int(x[:3])<=186)
          assert low==[n for n in range(1,187) if not 77<=n<=92]
          # Validar Hora por la función que efectivamente la renderiza, sin asumir nombre de su array.
          m=re.search(r'function\s+renderHoraV7\s*\([^)]*\)\s*\{(.*?)\n\}',h,re.S)
          assert m,'renderHoraV7 no localizada'
          body=m.group(1)
          assert 'playContent(it.enAudio,it.en,true)' in body
          assert 'playContent(it.esAudio,it.es,false)' in body
          assert 'playHoraV7(it.enAudio' not in body
          # El bloque especial debe contener 8 pares de audio de Hora en el HTML real.
          hour_pairs=re.findall(r'\{[^{}]*enAudio\s*:\s*["\'][^"\']+["\'][^{}]*esAudio\s*:\s*["\'][^"\']+["\'][^{}]*\}',h)
          assert len(hour_pairs)>=8,('pares especiales detectados',len(hour_pairs))
          print('OK: audios referenciados presentes; Hora renderiza inglés con micrófono y español sin micrófono')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK debug
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon
      - run: cp project/app/build/outputs/apk/debug/app-debug.apk Ingles-con-Fran-CANDIDATA-MICROFONO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ingles-con-Fran-CANDIDATA-MICROFONO
          path: Ingles-con-Fran-CANDIDATA-MICROFONO.apk
