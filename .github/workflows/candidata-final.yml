name: Candidata integral Ingles con Fran
on:
  push:
    branches: [ agent/auditoria-microfono-punta-a-punta ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir base congelada
        run: unzip -q Ingles-con-Fran-ANDROID-PROYECTO-PARA-COMPILAR.zip
      - name: Aplicar candidata integral
        run: python3 lab/apply_candidate.py
      - name: Controles estructurales por flujo real
        run: |
          H=project/app/src/main/assets/www/ABRIR-INGLES-CON-FRAN.html
          J=project/app/src/main/java/com/inglesconfran/app/MainActivity.java
          M=project/app/src/main/AndroidManifest.xml
          test -f project/app/src/main/assets/www/audio/187.wav
          grep -q 'RECORD_AUDIO' "$M"
          grep -q 'EXTRA_LANGUAGE,"en-US"' "$J"
          grep -q 'cancelListening' "$J"
          grep -q "en.onclick=()=>playContent(it.enAudio,it.en,true)" "$H"
          grep -q "es.onclick=()=>playContent(it.esAudio,it.es,false)" "$H"
          grep -q "WHITE:\['WIDE','WAIT'\]" "$H"
          grep -q "DOG:\['DOCK','DAWG'\]" "$H"
          grep -q 'showReward();celebrate()' "$H"
          ! grep -q "en.onclick=()=>playHoraV7" "$H"
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('project/app/src/main/assets/www/ABRIR-INGLES-CON-FRAN.html').read_text()
          ad=Path('project/app/src/main/assets/www/audio')
          refs=sorted(set(re.findall(r'["\'](\d{3}\.wav)["\']',h)))
          missing=[x for x in refs if not (ad/x).exists()]
          assert not missing,('audios referenciados faltantes',missing)
          # La base real omite 077-092 en referencias; no se fuerza continuidad ficticia.
          low=sorted(int(x[:3]) for x in refs if int(x[:3])<=186)
          expected=[n for n in range(1,187) if not 77<=n<=92]
          assert low==expected,(len(low),'inventario 001-186 distinto del congelado')
          # Hora debe conservar ocho tarjetas y ambas ramas deben pasar por playContent.
          mh=re.search(r'const HORA_V7\s*=\s*\[(.*?)\];',h,re.S)
          assert mh,'HORA_V7 no localizado'
          hour=mh.group(1)
          cards=hour.count('enAudio')
          assert cards==8,('tarjetas Hora',cards)
          assert "en.onclick=()=>playContent(it.enAudio,it.en,true)" in h
          assert "es.onclick=()=>playContent(it.esAudio,it.es,false)" in h
          print('OK inventario real: 170 referencias de contenido + Hora 8 tarjetas; todos los archivos referenciados existen')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK debug
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon
      - name: Guardar APK candidata
        run: cp project/app/build/outputs/apk/debug/app-debug.apk Ingles-con-Fran-CANDIDATA-MICROFONO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ingles-con-Fran-CANDIDATA-MICROFONO
          path: Ingles-con-Fran-CANDIDATA-MICROFONO.apk
