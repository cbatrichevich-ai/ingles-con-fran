name: Candidata integral Ingles con Fran
on:
  push:
    branches: [ agent/auditoria-microfono-punta-a-punta ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir base congelada
        run: unzip -q Ingles-con-Fran-ANDROID-PROYECTO-PARA-COMPILAR.zip
      - name: Aplicar candidata integral
        run: python3 lab/apply_candidate.py
      - name: Inventario y controles estructurales
        run: |
          H=project/app/src/main/assets/www/ABRIR-INGLES-CON-FRAN.html
          J=project/app/src/main/java/com/inglesconfran/app/MainActivity.java
          M=project/app/src/main/AndroidManifest.xml
          test -f project/app/src/main/assets/www/audio/187.wav
          grep -q 'RECORD_AUDIO' "$M"
          grep -q 'EXTRA_LANGUAGE,"en-US"' "$J"
          grep -q 'cancelListening' "$J"
          grep -q "en.onclick=()=>playContent(it.enAudio,it.en,true)" "$H"
          grep -q "es.onclick=()=>playContent(it.esAudio,it.es,false)" "$H"
          grep -q "WHITE:\['WIDE','WAIT'\]" "$H"
          grep -q "DOG:\['DOCK','DAWG'\]" "$H"
          grep -q 'showReward();celebrate()' "$H"
          ! grep -q "en.onclick=()=>playHoraV7" "$H"
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('project/app/src/main/assets/www/ABRIR-INGLES-CON-FRAN.html').read_text()
          # Inventario real por pares de archivos, no por una cifra asumida.
          nums=sorted(set(int(x) for x in re.findall(r'["\'](\d{3})\.wav["\']',h) if int(x)<=186))
          odd=[n for n in nums if n%2]
          even=[n for n in nums if not n%2]
          missing_nums=[n for n in range(1,187) if n not in nums]
          print('REFERENCIAS 001-186:',len(nums),'faltantes:',missing_nums)
          print('IMPARES:',len(odd),'PARES:',len(even))
          # DATA puede tener sintaxis mixta; validar cada archivo de contenido referenciado físicamente.
          ad=Path('project/app/src/main/assets/www/audio')
          missing_files=[f'{n:03d}.wav' for n in nums if not (ad/f'{n:03d}.wav').exists()]
          assert not missing_files,('audios referenciados faltantes',missing_files)
          assert not missing_nums,('numeración 001-186 no referenciada',missing_nums)
          print('OK: referencias 001-186 completas y archivos físicos presentes')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK debug
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon
      - name: Guardar APK candidata
        run: cp project/app/build/outputs/apk/debug/app-debug.apk Ingles-con-Fran-CANDIDATA-MICROFONO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ingles-con-Fran-CANDIDATA-MICROFONO
          path: Ingles-con-Fran-CANDIDATA-MICROFONO.apk
