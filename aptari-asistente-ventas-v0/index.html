<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>APTARI Asistente de Ventas</title><style>:root{--n:#083e4b;--b:#1877e8;--g:#18a66f;--bg:#f6f9fb;--t:#17283d;--m:#66788a;--w:#fff;--p:#eaf5ff;--q:#eaf9f1;--r:#fff0e7;--line:#dce6ed}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t)}button,input,select,textarea{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:88px}.top{position:sticky;top:0;z-index:10;background:rgba(246,249,251,.96);backdrop-filter:blur(8px);padding:18px 18px 10px;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.4px;color:var(--n);font-size:20px}.brand small{display:block;font-weight:600;font-size:11px;letter-spacing:1.4px}.hero{padding:18px}.hero h1{margin:0;font-size:25px}.hero p{margin:6px 0 0;color:var(--m)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.card{background:var(--w);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 5px 16px rgba(20,50,70,.06)}.stat strong{display:block;font-size:28px;margin-top:8px}.stat:nth-child(1){background:var(--q)}.stat:nth-child(2){background:var(--p)}.stat:nth-child(3){background:var(--r);grid-column:1/-1}.sec{padding:0 18px 18px}.sec h2{font-size:18px;margin:10px 0}.list{display:flex;flex-direction:column;gap:10px}.row{background:var(--w);border:1px solid var(--line);border-radius:15px;padding:13px 14px;display:flex;gap:12px;align-items:center}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#ddecfb;color:var(--n);font-weight:800;flex:0 0 auto}.grow{flex:1;min-width:0}.name{font-weight:800}.sub{font-size:13px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip{font-size:11px;border-radius:999px;padding:5px 8px;background:#edf3f6;color:var(--n)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:transparent;padding:8px 2px;color:#617284;font-size:12px;font-weight:700}.nav button.active{color:var(--b)}.fab{position:fixed;right:max(18px,calc((100vw - 520px)/2 + 18px));bottom:82px;width:56px;height:56px;border:0;border-radius:50%;background:var(--g);color:#fff;font-size:30px;box-shadow:0 8px 20px rgba(12,120,78,.26)}.hidden{display:none!important}.view{display:none}.view.active{display:block}.toolbar{display:flex;gap:8px;padding:14px 18px}.toolbar input{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff}.empty{text-align:center;color:var(--m);padding:38px 20px}.modal{position:fixed;inset:0;background:rgba(4,23,34,.48);display:grid;place-items:end center;z-index:50}.sheet{background:#fff;width:min(520px,100%);max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 16px;font-size:22px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--m);font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.field textarea{min-height:80px;resize:vertical}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800;flex:1}.primary{background:var(--b);color:#fff}.secondary{background:#eef3f6;color:var(--n)}.wa{background:#18a85f;color:#fff;width:100%;margin-top:10px}.detail{padding:18px}.detail .card{margin-bottom:12px}.kv{margin:9px 0}.kv b{display:block;font-size:12px;color:var(--m);margin-bottom:3px}.taskdone{text-decoration:line-through;opacity:.55}.check{width:24px;height:24px;border-radius:8px;border:2px solid #9ab0bf;display:grid;place-items:center;cursor:pointer}.check.on{background:var(--g);border-color:var(--g);color:#fff}.danger{color:#b3261e;background:#fff0ef}.note{font-size:12px;color:var(--m);padding:0 18px 16px}</style></head><body><main class="app"><header class="top"><div class="brand">APTARI<small>ASISTENTE DE VENTAS</small></div></header><section id="inicio" class="view active"><div class="hero"><h1>Hola</h1><p>Acá tenés lo más importante de hoy.</p><div class="grid"><div class="card stat" onclick="show('pendientes')">Hoy<strong id="stHoy">0</strong><span class="sub">acciones</span></div><div class="card stat" onclick="show('clientes')">Clientes<strong id="stClientes">0</strong><span class="sub">registrados</span></div><div class="card stat" onclick="show('pendientes')">Pendientes<strong id="stPend">0</strong><span class="sub">en seguimiento</span></div></div></div><div class="sec"><h2>Próximas acciones</h2><div id="homeTasks" class="list"></div></div></section><section id="clientes" class="view"><div class="hero"><h1>Clientes</h1><p>Consultas y pedidos en un solo lugar.</p></div><div class="toolbar"><input id="buscar" placeholder="Buscar cliente…" oninput="renderClients()"></div><div class="sec"><div id="clientList" class="list"></div></div></section><section id="pendientes" class="view"><div class="hero"><h1>Pendientes</h1><p>Lo que todavía necesita una acción.</p></div><div class="sec"><div id="taskList" class="list"></div></div></section><section id="detalle" class="view"><div class="detail"><button class="btn secondary" style="max-width:120px" onclick="show('clientes')">← Volver</button><div id="detailBody"></div></div></section></main><button class="fab" id="fab" onclick="openClientModal()">+</button><nav class="nav"><button data-v="inicio" class="active" onclick="show('inicio')">Inicio</button><button data-v="clientes" onclick="show('clientes')">Clientes</button><button data-v="pendientes" onclick="show('pendientes')">Pendientes</button></nav><div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet"><h3 id="modalTitle">Nuevo cliente</h3><input id="editId" type="hidden"><div class="field"><label>Nombre</label><input id="fNombre" placeholder="Ej. Juan Pérez"></div><div class="field"><label>Teléfono con código de país</label><input id="fTel" inputmode="tel" placeholder="Ej. 5491112345678"></div><div class="field"><label>Producto / consulta</label><input id="fPedido" placeholder="Ej. Zapatillas rojas talle 45"></div><div class="field"><label>Estado</label><select id="fEstado"><option>Nuevo</option><option>Consulta</option><option>Precio enviado</option><option>Esperando respuesta</option><option>Pedido confirmado</option><option>Pago pendiente</option><option>Pagado</option><option>Finalizado</option></select></div><div class="field"><label>Notas</label><textarea id="fNotas" placeholder="Datos que conviene recordar"></textarea></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveClient()">Guardar</button></div></div></div><div id="taskModal" class="modal hidden" onclick="if(event.target===this)closeTaskModal()"><div class="sheet"><h3>Nueva acción</h3><input id="taskClientId" type="hidden"><div class="field"><label>Qué hay que hacer</label><input id="tTexto" placeholder="Ej. Enviar precio del pedido"></div><div class="field"><label>Fecha</label><input id="tFecha" type="date"></div><div class="field"><label>Hora</label><input id="tHora" type="time"></div><div class="actions"><button class="btn secondary" onclick="closeTaskModal()">Cancelar</button><button class="btn primary" onclick="saveTask()">Guardar</button></div></div></div><script>const KEY='aptari_asistente_ventas_v0';let db=load();function seed(){if(db.clients.length)return;const today=new Date().toISOString().slice(0,10);db={clients:[{id:1,nombre:'Juan Pérez',tel:'5491112345678',pedido:'Zapatillas rojas talle 45',estado:'Precio enviado',notas:'Consultó por envío a Caballito.'},{id:2,nombre:'María Gómez',tel:'5491122233344',pedido:'Cartera negra',estado:'Pedido confirmado',notas:'Retira por el local.'},{id:3,nombre:'Carlos Ruiz',tel:'5491133344455',pedido:'Buzo talle L',estado:'Pago pendiente',notas:''}],tasks:[{id:101,clientId:1,texto:'Consultar si confirma el pedido',fecha:today,hora:'10:00',done:false},{id:102,clientId:2,texto:'Confirmar retiro',fecha:today,hora:'12:00',done:false},{id:103,clientId:3,texto:'Recordar pago',fecha:today,hora:'16:00',done:false}]};save()}seed();function load(){try{return JSON.parse(localStorage.getItem(KEY))||{clients:[],tasks:[]}}catch(e){return{clients:[],tasks:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}function today(){return new Date().toISOString().slice(0,10)}function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function initials(n){return n.split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===id));document.getElementById('fab').classList.toggle('hidden',id==='detalle');renderAll();scrollTo(0,0)}function renderAll(){document.getElementById('stClientes').textContent=db.clients.length;const pend=db.tasks.filter(t=>!t.done);document.getElementById('stPend').textContent=pend.length;document.getElementById('stHoy').textContent=pend.filter(t=>t.fecha===today()).length;renderHome();renderClients();renderTasks()}function clientBy(id){return db.clients.find(c=>c.id===id)}function renderHome(){const arr=db.tasks.filter(t=>!t.done).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora)).slice(0,5);homeTasks.innerHTML=arr.length?arr.map(taskRow).join(''):'<div class="empty">No hay acciones pendientes.</div>'}function renderClients(){const q=(buscar?.value||'').toLowerCase();const arr=db.clients.filter(c=>(c.nombre+' '+c.pedido+' '+c.estado).toLowerCase().includes(q));clientList.innerHTML=arr.length?arr.map(c=>`<div class="row" onclick="openDetail(${c.id})"><div class="avatar">${esc(initials(c.nombre))}</div><div class="grow"><div class="name">${esc(c.nombre)}</div><div class="sub">${esc(c.pedido||'Sin detalle')}</div></div><span class="chip">${esc(c.estado)}</span></div>`).join(''):'<div class="empty">No hay clientes.</div>'}function taskRow(t){const c=clientBy(t.clientId);return `<div class="row ${t.done?'taskdone':''}"><div class="check ${t.done?'on':''}" onclick="event.stopPropagation();toggleTask(${t.id})">${t.done?'✓':''}</div><div class="grow" onclick="openDetail(${t.clientId})"><div class="name">${esc(c?c.nombre:'Cliente')}</div><div class="sub">${esc(t.texto)}</div></div><span class="chip">${esc(t.fecha===today()?'Hoy':t.fecha)} ${esc(t.hora||'')}</span></div>`}function renderTasks(){const arr=db.tasks.filter(t=>!t.done).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));taskList.innerHTML=arr.length?arr.map(taskRow).join(''):'<div class="empty">Todo al día.</div>'}function openDetail(id){const c=clientBy(id);if(!c)return;const tasks=db.tasks.filter(t=>t.clientId===id&&!t.done);detailBody.innerHTML=`<h1>${esc(c.nombre)}</h1><div class="card"><div class="kv"><b>Producto / consulta</b>${esc(c.pedido||'-')}</div><div class="kv"><b>Estado</b>${esc(c.estado)}</div><div class="kv"><b>Notas</b>${esc(c.notas||'-')}</div></div><button class="btn wa" onclick="openWhatsApp('${esc(c.tel)}')">Abrir WhatsApp</button><div class="actions"><button class="btn secondary" onclick="openClientModal(${c.id})">Editar</button><button class="btn primary" onclick="openTaskModal(${c.id})">Nueva acción</button></div><h2 style="margin-top:22px">Pendientes</h2><div class="list">${tasks.length?tasks.map(taskRow).join(''):'<div class="empty">Sin pendientes.</div>'}</div>`;show('detalle')}function openWhatsApp(tel){const n=String(tel||'').replace(/\D/g,'');if(!n)return alert('Falta el teléfono del cliente.');location.href='https://wa.me/'+n}function openClientModal(id){editId.value=id||'';const c=id?clientBy(id):null;modalTitle.textContent=c?'Editar cliente':'Nuevo cliente';fNombre.value=c?.nombre||'';fTel.value=c?.tel||'';fPedido.value=c?.pedido||'';fEstado.value=c?.estado||'Nuevo';fNotas.value=c?.notas||'';modal.classList.remove('hidden')}function closeModal(){modal.classList.add('hidden')}function saveClient(){if(!fNombre.value.trim())return alert('Ingresá el nombre.');const id=Number(editId.value)||Date.now();const obj={id,nombre:fNombre.value.trim(),tel:fTel.value.trim(),pedido:fPedido.value.trim(),estado:fEstado.value,notas:fNotas.value.trim()};const i=db.clients.findIndex(c=>c.id===id);if(i>=0)db.clients[i]=obj;else db.clients.push(obj);closeModal();save();show('clientes')}function openTaskModal(clientId){taskClientId.value=clientId;tTexto.value='';tFecha.value=today();tHora.value='';taskModal.classList.remove('hidden')}function closeTaskModal(){taskModal.classList.add('hidden')}function saveTask(){if(!tTexto.value.trim())return alert('Escribí la acción.');db.tasks.push({id:Date.now(),clientId:Number(taskClientId.value),texto:tTexto.value.trim(),fecha:tFecha.value||today(),hora:tHora.value,done:false});closeTaskModal();save();openDetail(Number(taskClientId.value))}function toggleTask(id){const t=db.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save()}}renderAll();</script></body></html>
